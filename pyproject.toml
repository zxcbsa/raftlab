[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raftlab"
version = "0.1.0"
description = "Reproducible performance and chaos experiments for a Raft KV cluster"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[project.scripts]
raftlab = "raftlab.cli:main"

[tool.setuptools]
packages = ["raftlab"]
include-package-data = true

[tool.setuptools.package-data]
raftlab = ["schemas/*.json"]
